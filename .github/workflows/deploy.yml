name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-server:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore server dependencies
        run: dotnet restore Apps/Server/CairoTransportation/CairoTransportation.csproj

      - name: Build server
        run: dotnet build Apps/Server/CairoTransportation/CairoTransportation.csproj --configuration Release --no-restore

      - name: Publish server
        run: dotnet publish Apps/Server/CairoTransportation/CairoTransportation.csproj --configuration Release --output ./publish/server

  build-client:
    runs-on: ubuntu-latest
    needs: build-server
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Apps/client/package-lock.json

      - name: Install client dependencies
        run: npm install
        working-directory: Apps/client

      - name: Build client
        run: npm run build
        working-directory: Apps/client

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: Apps/client/out

  deploy:
    runs-on: ubuntu-latest
    needs: build-client
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Download server artifacts
        uses: actions/download-artifact@v4
        with:
          name: server-build
          path: ./server

      - name: Download client artifacts
        uses: actions/download-artifact@v4
        with:
          name: client-build
          path: ./client

      - name: List artifacts
        run: |
          echo "Server files:"
          ls -la ./server
          echo "Client files:"
          ls -la ./client

      # Add your deployment steps here (e.g., to AWS, Azure, Docker Hub, etc.)
